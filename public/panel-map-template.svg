<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1200" viewBox="0 0 800 1200">
  <style>
    .title { font: 700 24px/1.2 'Arial'; fill: #0a1628 }
    .label { font: 400 16px/1.2 'Arial'; fill: #0a1628 }
    .box { fill: #ffffff; stroke: #0a1628; stroke-width: 2 }
    .divider { stroke: #e8600a; stroke-width: 2 }
  </style>
  <rect class="box" x="20" y="20" width="760" height="1160" rx="12" ry="12"/>
  <text x="40" y="60" class="title">Electrical Panel Map Template</text>
  <text x="40" y="90" class="label">Address: ____________________________</text>
  <text x="40" y="115" class="label">Date: _______________________________</text>

  <!-- Grid of breakers -->
  <g transform="translate(40,150)">
    <rect x="0" y="0" width="160" height="40" class="box"/>
    <text x="10" y="26" class="label">1. __________________________</text>

    <rect x="0" y="60" width="160" height="40" class="box"/>
    <text x="10" y="86" class="label">2. __________________________</text>

    <rect x="0" y="120" width="160" height="40" class="box"/>
    <text x="10" y="146" class="label">3. __________________________</text>

    <rect x="0" y="180" width="160" height="40" class="box"/>
    <text x="10" y="206" class="label">4. __________________________</text>

    <rect x="180" y="0" width="160" height="40" class="box"/>
    <text x="190" y="26" class="label">5. __________________________</text>

    <rect x="180" y="60" width="160" height="40" class="box"/>
    <text x="190" y="86" class="label">6. __________________________</text>

    <rect x="180" y="120" width="160" height="40" class="box"/>
    <text x="190" y="146" class="label">7. __________________________</text>

    <rect x="180" y="180" width="160" height="40" class="box"/>
    <text x="190" y="206" class="label">8. __________________________</text>

    <rect x="360" y="0" width="160" height="40" class="box"/>
    <text x="370" y="26" class="label">9. __________________________</text>

    <rect x="360" y="60" width="160" height="40" class="box"/>
    <text x="370" y="86" class="label">10. _________________________</text>

    <rect x="360" y="120" width="160" height="40" class="box"/>
    <text x="370" y="146" class="label">11. _________________________</text>

    <rect x="360" y="180" width="160" height="40" class="box"/>
    <text x="370" y="206" class="label">12. _________________________</text>
  </g>

  <line x1="40" y1="260" x2="760" y2="260" class="divider"/>
  <text x="40" y="290" class="label">Notes:</text>
  <text x="40" y="320" class="label">- Indicate outdoor units, garage, kitchen, etc.</text>
  <text x="40" y="345" class="label">- Note multi-wire branches or shared neutrals</text>
  <text x="40" y="370" class="label">- Save a digital/photo copy for future reference</text>
</svg>